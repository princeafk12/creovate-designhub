<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My account | CREOVATE DesignHub</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page"><main class="auth-shell wrap"><header class="account-header"><a class="logo auth-logo" href="index.html">CREOVATE <span>—</span><br>DesignHub</a><button class="button button-outline-dark" data-logout type="button">Log out</button></header><section class="auth-card"><p class="eyebrow eyebrow-dark">Client area</p><h1>My saved briefs.</h1><p id="account-email">Loading your account…</p><div id="orders-list" class="orders-list"></div><a class="button button-dark" href="index.html#brief">Send another brief</a><p data-auth-message class="form-status" role="status" aria-live="polite"></p></section></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
(async()=>{const user=await CREOVATE_AUTH.requireUser();if(!user)return;document.querySelector('#account-email').textContent=user.email;const {data:orders,error}=await CREOVATE_AUTH.client().from('orders').select('service_name,price,rush,status,created_at,brief').order('created_at',{ascending:false});const list=document.querySelector('#orders-list');if(error){CREOVATE_AUTH.message(document.querySelector('[data-auth-message]'),error.message,true);return;}if(!orders?.length){list.innerHTML='<p>No saved briefs yet. Your next brief will appear here after you send it.</p>';return;}list.innerHTML=orders.map(order=>`<article class="order-card"><strong>${CREOVATE_AUTH.escapeHtml(order.service_name)}</strong><span>₦${Number(order.price).toLocaleString('en-NG')}${order.rush?' · Rush':''}</span><small>${new Date(order.created_at).toLocaleString('en-NG')} · ${CREOVATE_AUTH.escapeHtml(order.status)}</small></article>`).join('');})();
</script><script src="account-enhancements.js"></script></body>
</html>
