<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | CREOVATE DesignHub</title><link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell wrap">
    <div class="logo auth-logo" aria-label="CREOVATE DesignHub">CREOVATE <span>—</span><br>DesignHub</div>
    <div class="auth-topbar"><span>Already have an account?</span><a class="button button-outline-dark auth-top-button" data-auth-switch="login.html" href="login.html">Log in</a></div>
    <section class="auth-card auth-primary-card"><p class="eyebrow eyebrow-dark">New client</p><h1>Create your account.</h1><p>Save your design briefs, follow up on orders, and use the business validator in one place.</p>
      <form id="signup-form" class="auth-form"><label>Your name<input name="name" type="text" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></label><button class="button button-lime" type="submit">Create account</button></form>
      <p data-auth-message class="form-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script>
</body>
</html>
