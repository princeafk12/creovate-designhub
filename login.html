<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client login | CREOVATE DesignHub</title><link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell wrap">
    <div class="logo auth-logo" aria-label="CREOVATE DesignHub">CREOVATE <span>—</span><br>DesignHub</div>
    <div class="auth-topbar"><span>New to CREOVATE?</span><a class="button button-outline-dark auth-top-button" data-auth-switch="signup.html" href="signup.html">Create account</a></div>
    <section class="auth-card auth-primary-card"><p class="eyebrow eyebrow-dark">Client area</p><h1>Welcome back.</h1><p>Log in to view your saved design briefs and orders.</p>
      <form id="login-form" class="auth-form"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-dark" type="submit">Log in</button></form>
      <p class="auth-links"><button type="button" class="auth-link-button" id="reset-toggle" aria-controls="reset-inline" aria-expanded="false">Forgot your password?</button> · <a href="admin-login.html">Admin login</a></p>
      <div class="inline-reset" id="reset-inline" hidden>
        <p>Enter your email and we’ll send you a password-reset link.</p>
        <form id="reset-request-form" class="auth-form inline-reset-form"><label>Email address<input name="email" type="email" autocomplete="email" required></label><div class="inline-reset-actions"><button class="button button-outline-dark" type="submit">Send reset link</button><button type="button" class="text-button" id="reset-cancel">Cancel</button></div></form>
      </div>
      <p data-auth-message class="form-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script>
</body>
</html>
