<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard | CREOVATE DesignHub</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page"><main class="auth-shell admin-shell wrap"><header class="account-header"><a class="logo auth-logo" href="index.html">CREOVATE <span>—</span><br>DesignHub</a><button class="button button-outline-dark" data-logout type="button">Log out</button></header><section class="auth-card"><p class="eyebrow eyebrow-dark">Owner controls</p><h1>Manage the website.</h1><p>Changes here update the public website when visitors reload it.</p><form id="settings-form" class="auth-form admin-form"><label><span>Launch offer active</span><input id="launch-active" type="checkbox"></label><label>Total launch spots<input id="launch-total" type="number" min="0" required></label><label>Launch spots remaining<input id="launch-remaining" type="number" min="0" required></label><label>Discount percentage<input id="discount-percent" type="number" min="0" max="100" required></label><label>Rush percentage<input id="rush-percent" type="number" min="0" max="100" required></label><button class="button button-dark" type="submit">Save offer settings</button></form><p id="settings-status" class="form-status" role="status" aria-live="polite"></p></section><section class="auth-card"><h2>Services and prices</h2><div id="services-editor" class="services-editor"></div><button id="save-services" class="button button-dark" type="button">Save service settings</button><p id="services-status" class="form-status" role="status" aria-live="polite"></p></section><section class="auth-card"><h2>Recent orders</h2><div id="admin-orders" class="orders-list"></div></section></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
(async()=>{const access=await CREOVATE_AUTH.requireAdmin();if(!access)return;const db=CREOVATE_AUTH.client();const settingsStatus=document.querySelector('#settings-status');const servicesStatus=document.querySelector('#services-status');const {data:settings}=await db.from('site_settings').select('*').eq('id',1).maybeSingle();if(settings){document.querySelector('#launch-active').checked=settings.launch_active;document.querySelector('#launch-total').value=settings.launch_spots_total;document.querySelector('#launch-remaining').value=settings.launch_spots_remaining;document.querySelector('#discount-percent').value=settings.discount_percent;document.querySelector('#rush-percent').value=settings.rush_percent;}const {data:services,error:serviceError}=await db.from('services').select('*').order('name');const editor=document.querySelector('#services-editor');if(serviceError){servicesStatus.textContent=serviceError.message;servicesStatus.classList.add('is-error');return;}editor.innerHTML=(services||[]).map(item=>`<fieldset class="service-editor" data-slug="${CREOVATE_AUTH.escapeHtml(item.slug)}"><legend>${CREOVATE_AUTH.escapeHtml(item.name)}</legend><label>Launch price<input data-field="launch_price" type="number" min="0" value="${Number(item.launch_price)}"></label><label>Standard price<input data-field="standard_price" type="number" min="0" value="${Number(item.standard_price)}"></label><label>Delivery time<input data-field="delivery_time" type="text" value="${CREOVATE_AUTH.escapeHtml(item.delivery_time)}"></label><label class="check-row">Rush available<input data-field="rush_enabled" type="checkbox" ${item.rush_enabled?'checked':''}></label><label>Description<textarea data-field="description" rows="2">${CREOVATE_AUTH.escapeHtml(item.description)}</textarea></label></fieldset>`).join('');document.querySelector('#settings-form').addEventListener('submit',async event=>{event.preventDefault();const result=await db.from('site_settings').update({launch_active:document.querySelector('#launch-active').checked,launch_spots_total:Number(document.querySelector('#launch-total').value),launch_spots_remaining:Number(document.querySelector('#launch-remaining').value),discount_percent:Number(document.querySelector('#discount-percent').value),rush_percent:Number(document.querySelector('#rush-percent').value),updated_at:new Date().toISOString()}).eq('id',1);settingsStatus.textContent=result.error?result.error.message:'Offer settings saved.';settingsStatus.classList.toggle('is-error',Boolean(result.error));});document.querySelector('#save-services').addEventListener('click',async()=>{const updates=Array.from(document.querySelectorAll('.service-editor')).map(editor=>{const read=field=>editor.querySelector(`[data-field="${field}"]`);return db.from('services').update({launch_price:Number(read('launch_price').value),standard_price:Number(read('standard_price').value),delivery_time:read('delivery_time').value,rush_enabled:read('rush_enabled').checked,description:read('description').value,updated_at:new Date().toISOString()}).eq('slug',editor.dataset.slug);});const results=await Promise.all(updates);const error=results.find(result=>result.error)?.error;servicesStatus.textContent=error?error.message:'Service settings saved.';servicesStatus.classList.toggle('is-error',Boolean(error));});const {data:orders}=await db.from('orders').select('service_name,price,rush,status,created_at,brief').order('created_at',{ascending:false}).limit(25);document.querySelector('#admin-orders').innerHTML=orders?.length?orders.map(order=>`<article class="order-card"><strong>${CREOVATE_AUTH.escapeHtml(order.service_name)}</strong><span>₦${Number(order.price).toLocaleString('en-NG')}${order.rush?' · Rush':''}</span><small>${new Date(order.created_at).toLocaleString('en-NG')} · ${CREOVATE_AUTH.escapeHtml(order.status)} · ${CREOVATE_AUTH.escapeHtml(order.brief?.name||'')}</small></article>`).join(''):'<p>No saved orders yet.</p>';})();
</script></body>
</html>
