<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Secure admin access | CREOVATE DesignHub</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page">
  <main class="auth-shell wrap">
    <div class="logo auth-logo" aria-label="CREOVATE DesignHub">CREOVATE <span>—</span><br>DesignHub</div>
    <section class="auth-card mfa-card">
      <p class="eyebrow eyebrow-dark">Authenticator security</p>
      <h1>Secure the admin account.</h1>
      <p id="mfa-intro">Add CREOVATE DesignHub to Google Authenticator, Microsoft Authenticator, or another compatible TOTP app.</p>
      <form id="mfa-start-form" class="auth-form">
        <label>Owner password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button button-dark" type="submit">Generate setup code</button>
      </form>
      <div id="mfa-enrollment" class="mfa-enrollment" hidden>
        <canvas id="mfa-qr" class="mfa-qr" aria-label="Authenticator setup QR code"></canvas>
        <p class="mfa-secret-label">If scanning does not work, enter this setup key manually:</p>
        <code id="mfa-secret" class="mfa-secret"></code>
        <form id="mfa-verify-form" class="auth-form">
          <label>Authenticator code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
          <button class="button button-dark" type="submit">Confirm authenticator</button>
        </form>
      </div>
      <p id="mfa-status" class="form-status" role="status" aria-live="polite"></p>
      <p><a href="admin-login.html">Return to admin login</a></p>
    </section>
  </main>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script type="module" src="mfa.js"></script>
</body>
</html>
